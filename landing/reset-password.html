<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Reset your password · MomEase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root { --bg:#FDE5EC; --card:#fff; --ink:#4A1D32; --muted:#8B5A70; --pink:#F472B6; --deep:#DB2777; --err:#B91C1C; --ok:#047857; }
  @media (prefers-color-scheme: dark) { :root { --bg:#2A1220; --card:#3A1A2D; --ink:#FCE7F0; --muted:#E5B3C9; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink); font-family:'Quicksand',system-ui,sans-serif; }
  main { width:100%; max-width:420px; background:var(--card); border-radius:24px; padding:32px 24px; box-shadow:0 12px 40px rgba(219,39,119,.15); }
  h1 { font-family:'Fraunces',Georgia,serif; font-size:28px; margin:0 0 8px; }
  p { color:var(--muted); line-height:1.5; margin:0 0 20px; }
  label { display:block; font-weight:600; margin:14px 0 6px; }
  input { width:100%; padding:14px; border-radius:14px; border:2px solid #F9C5DA; font:inherit; background:transparent; color:inherit; }
  input:focus { outline:none; border-color:var(--deep); }
  button { width:100%; margin-top:22px; padding:15px; border:0; border-radius:16px; font:inherit; font-weight:600; font-size:16px; color:#fff; background:linear-gradient(135deg,var(--pink),var(--deep)); cursor:pointer; }
  button:disabled { opacity:.6; cursor:default; }
  #msg { min-height:22px; margin-top:14px; font-weight:600; }
  .err { color:var(--err); } .ok { color:var(--ok); }
  a { color:var(--deep); }
</style>
</head>
<body>
<main>
  <h1>Choose a new password</h1>
  <p id="lead">Pick something at least 8 characters long. You'll be signed out on all other devices.</p>
  <form id="f" novalidate>
    <label for="pw">New password</label>
    <input id="pw" type="password" autocomplete="new-password" minlength="8" required>
    <label for="pw2">Confirm password</label>
    <input id="pw2" type="password" autocomplete="new-password" minlength="8" required>
    <button id="go" type="submit">Reset password</button>
  </form>
  <div id="msg" role="status" aria-live="polite"></div>
</main>
<script>
(function () {
  var API = 'https://momease-data-api.pipilot-rpc.workers.dev';
  var token = new URLSearchParams(location.hash.slice(1)).get('token');
  // Keep the token out of history and any later navigation.
  if (location.hash) history.replaceState(null, '', location.pathname);
  var f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  function say(t, cls) { msg.textContent = t; msg.className = cls || ''; }
  if (!token) {
    f.hidden = true;
    document.getElementById('lead').textContent = 'This reset link is missing or has already been used.';
    say('Request a new link from the sign-in screen (Forgot password?).', 'err');
    return;
  }
  f.addEventListener('submit', function (e) {
    e.preventDefault();
    var a = document.getElementById('pw').value, b = document.getElementById('pw2').value;
    if (a.length < 8) return say('Password must be at least 8 characters.', 'err');
    if (a !== b) return say("Those passwords don't match.", 'err');
    go.disabled = true; say('Saving…');
    fetch(API + '/auth/reset/confirm', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: token, password: a }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) {
        if (r.ok) { f.hidden = true; document.getElementById('lead').textContent = 'All set!'; say('Your password was updated. Open the MomEase app and sign in with it.', 'ok'); }
        else { go.disabled = false; say(r.j && r.j.error === 'token_invalid' ? 'This link has expired or was already used. Request a new one.' : 'Something went wrong. Please try again.', 'err'); }
      })
      .catch(function () { go.disabled = false; say("Can't reach MomEase. Check your connection and try again.", 'err'); });
  });
})();
</script>
</body>
</html>
