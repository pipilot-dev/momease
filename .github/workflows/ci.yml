name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (typecheck + vitest)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: data-api } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: data-api/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  app:
    name: App (typecheck + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:unit

  e2e:
    name: E2E (web build + local worker, Playwright)
    runs-on: ubuntu-latest
    needs: [api, app]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir data-api install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build:e2e
      - run: pnpm test:e2e
        env: { CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: e2e-screenshots, path: tests/e2e/.artifacts }
